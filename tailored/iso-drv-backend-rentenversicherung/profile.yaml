title: Jens Laufer — Backendentwicklung Java, Schnittstellen und Datenaustausch
headline: Backendentwickler — Java und Spring Boot, REST- und SOAP-Schnittstellen, relationale Datenbanken, Tests und CI
stack_line: Java · Spring Boot · Microservices / SOA · REST / OpenAPI · SOAP / Webservices · Oracle · MySQL · JPA / Hibernate · OAuth2 / OIDC / JWT · JUnit / TDD · Maven · Jenkins · GitLab CI · Docker · Kubernetes / Rancher
pitch: >-
  Ich entwickle Backends in Java, meist in bestehenden,
  geschäftskritischen Systemen. Bei 1&1 habe ich Webservices auf einem ESB
  gebaut, mit Oracle und der Rechnungsübergabe an SAP. Beim Deutschen
  Reisebüro habe ich Businessservices mit SOAP umgesetzt, bei der
  Commerzbank die Stammdatenverwaltung mit Java EE und Oracle migriert. Bei
  Condor habe ich ein Java-EE-Backend auf Spring Boot modernisiert. Bei
  Brunata, der Deutschen Telekom und Volkswagen habe ich Spring-Boot-Services
  mit REST-Schnittstellen testgetrieben entwickelt, bei Brunata und der
  Telekom mit GitLab CI. Abgesichert habe ich sie bei Brunata mit Spring
  Security und Keycloak, bei der Telekom mit Keycloak. Tokenbasierte
  Authentifizierung habe ich mehrfach selbst gebaut: einen OAuth2-Service bei
  der DVAG und einen eigenen OIDC-Server mit signierten JWTs.
  {career_years} Jahre als freiberuflicher Entwickler.
highlights:
- "**Bestehende Systeme modernisieren:** Java EE nach Spring Boot bei Condor, Stammdatenmigration bei der Commerzbank, Prototyp in den Betrieb überführt bei der Deutschen Telekom."
- "**Schnittstellen und Datenaustausch:** Webservices auf einem ESB und Rechnungsübergabe an SAP bei 1&1, SOAP beim Deutschen Reisebüro, Anbindung eines Inkasso-Anbieters bei der DVAG, Austauschformat Haweiko-Arge bei Brunata."
- "**Applikationssicherheit:** OAuth2-Service bei der DVAG, Spring Security und Keycloak bei Brunata, Keycloak bei der Telekom, eigener OIDC-Server mit RS256-JWTs je Mandant."
- "**Tests und CI als Standard:** JUnit, Mockito und TDD bei Brunata, der Telekom, Volkswagen und der DVAG, Build und Deployment mit Maven, Jenkins und GitLab CI."
- "**Betrieb:** Docker und Kubernetes bei der Telekom (mit Rancher), Volkswagen und der DVAG."
