highlights:
- "**End-to-end technical ownership:** freelance since 1997, embedded in the client's team — technical discovery, architecture and design decisions, delivery, production support and handover, on site or remote."
- "**AI-assisted engineering with controls, in production since 10/2025:** agent loop with stop conditions, tool use over MCP, layered memory, RAG, quality gates and approval gates, observability over every run, budget and rate-limit control with model routing, and recovery after a killed run."
- "**Verification against agent drift:** agents' output is checked against the spec and the diff, not against their own report — a test must reproduce a bug red before the fix may turn it green."
- "**Agent harnesses in daily production use:** Fabrik (parallel worker agents, ticket to PR), an unattended coding pipeline (759 tasks to date) and an LLM agent that runs the finance back office of a GmbH with a human approving every filing."
- "**Enterprise integration:** invoice handover to **SAP** over an ESB (1&1), master data migration on a canonical XML model (Commerzbank), an industry file format in heating cost billing (Brunata)."
- "**Prototype to production:** took over a running prototype at Deutsche Telekom and put it live — Docker/Kubernetes, tracing and CI included."
