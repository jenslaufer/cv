pitch: >-
  Ich baue LLM-Agenten, die produktiv laufen, und die Technik um das Modell
  herum: Agenten-Loop mit Abbruchbedingungen, Tool-Use über MCP, Memory,
  Freigabe-Gates vor allem Unumkehrbaren, Observability über jeden Lauf und
  Budget-Steuerung mit Modell-Routing. Ein Agent führt die Buchhaltung einer
  GmbH, jede Meldung gibt ein Mensch frei. Über 40 eigene Prüfwerkzeuge messen
  die Arbeit der Agenten an der Wirklichkeit statt an ihrem eigenen Bericht,
  fail-closed und mit eigenen Tests. Coding-Agenten arbeiten Tickets bis zum
  Pull Request ab, mit Quality Gate vor jedem Push. Davor Machine Learning
  (Reinforcement Learning, Zahlungsprognose) und {career_years} Jahre
  Backend-Entwicklung, auch in regulierten Umfeldern wie Commerzbank und DVAG.
