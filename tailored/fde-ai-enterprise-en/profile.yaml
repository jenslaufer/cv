title: Jens Laufer — Forward Deployed Engineer (AI agents + enterprise integration)
headline: Forward Deployed Engineer — LLM agents running in production, inside the systems a business already has
stack_line: Python · LLM agents, tool use & MCP · agent harness (loop, memory, approval gates, observability, budget control) · RAG · REST APIs & enterprise integration (SAP, ESB, canonical data models) · Java / Spring Boot · Docker / CI
pitch: >-
  I build the harness: the loop, the tools, the memory, the gates and the
  observability that turn a language model into a system somebody can rely on
  while nobody is watching. Two of mine run in production today — an autonomous
  AI business partner that plans, writes code, tests and deploys around the
  clock, and Fabrik, a multi-agent platform where worker agents ship software in
  parallel. Before that, sixteen years of back-end and integration work sitting
  with the customer: invoice platforms, handing invoices to SAP over an ESB,
  master data migration at a major bank, an industry file format in utility
  billing. That is the forward deployed combination — the AI side, and the side
  where ERP, CRM and document workflows have been running for decades. Freelance
  since 1997, so requirements, delivery and production support have always been
  the same conversation.
highlights:
- "**Harness engineering is the work, in production since 12/2025:** agent loop with stop conditions, **tool use over MCP**, layered memory, RAG, approval gates before anything irreversible, quality gates an agent must pass before it may ship, observability over every run, budget and rate-limit control with model routing and fallback, and recovery after a killed run."
- "**Two harnesses running live:** an autonomous AI business partner that plans, writes code, tests and deploys around the clock, and **Fabrik**, a multi-agent platform where worker agents pick up tickets and ship in parallel. A local multi-model proxy keeps both independent of any single provider."
- "**Forward deployed by habit:** freelance since 1997, always inside the customer's team (Telekom, Commerzbank, Volkswagen, Audi, DVAG, Brunata) — scoping in conversation, delivering on site or remote, staying through production."
- "**Integration into systems that already exist:** invoice handover to **SAP** over an ESB (1&1), master data migration on a canonical XML model (Commerzbank), the Haweiko-Arge industry format in heating cost billing (Brunata)."
- "**Prototype to production:** took over a running prototype at Deutsche Telekom, developed it further and put it live — with the Docker/Kubernetes, tracing and CI work that being live actually requires."
- "**Python and back-end depth:** REST back-ends in Python (Eve, Flask) and Java/Spring Boot microservices with OpenAPI, shipped in Docker, test-driven throughout."
